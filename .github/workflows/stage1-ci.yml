# Stage 1 CI (proposed; owner-approved approach 2026-10-12). Isolated branch only.
# Third-party actions are pinned by full commit SHA. No secrets are used.
# Sibling repositories are checked out at pinned SHAs: no undocumented
# estate state. Known defects on pinned main are asserted explicitly, never
# hidden behind continue-on-error.
name: stage1-ci
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  # Integration jobs test Stage 1 components together at their intended
  # revisions. Baseline defect jobs use the *_MAIN_SHA pins only.
  SPEC_SHA: 39e91e867a710cdecfcf3ebd391f6c566e6fbc4f
  SPEC_MAIN_SHA: cf728450e5eb12ffa7d3cc6d405cf53c92e00fae
  MAIN_SHA: 93d75a6e3e9558f1ce7e7763da6defdc56fe1371
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-release,   os: ubuntu-24.04,     cc: gcc,   type: Release, san: "" }
          - { name: clang-release, os: ubuntu-24.04,     cc: clang, type: Release, san: "" }
          - { name: asan-ubsan,    os: ubuntu-24.04,     cc: gcc,   type: Debug,   san: "-fsanitize=address,undefined -fno-sanitize-recover=all" }
          - { name: arm64-gcc,     os: ubuntu-24.04-arm, cc: gcc,   type: Release, san: "" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: estate/axioma-governance
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SpeyTech/axioma-spec
          ref: ${{ env.SPEC_SHA }}
          path: estate/axioma-spec
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang shellcheck libcurl4-openssl-dev
          ${{ matrix.cc }} --version | head -1; uname -m
      - name: Build axioma-spec SHA-256 substrate into a job-local sdk-root
        # Never install the libaxilog Q16.16 archive here: both are named
        # libaxilog.a (finding A-08).
        run: |
          cmake -S estate/axioma-spec -B build-spec -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build-spec
          mkdir -p sdk-root/lib sdk-root/include/axilog
          cp build-spec/libaxilog.a sdk-root/lib/
          cp estate/axioma-spec/include/axilog/*.h sdk-root/include/axilog/
      - name: Configure, build, test
        run: |
          SAN="${{ matrix.san }}"
          cmake -S estate/axioma-governance -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} \
                -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_C_FLAGS="$SAN" \
                -DCMAKE_EXE_LINKER_FLAGS="${SAN:+-fsanitize=address,undefined}" \
                -DAXILOG_SDK_ROOT="$PWD/sdk-root"
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: Cross-architecture fingerprint (must equal ci/fingerprints.txt on every matrix entry)
        run: |
          cd estate/axioma-governance
          SAN="${{ matrix.san }}"
          ${{ matrix.cc }} -std=c99 -O2  $SAN -Iinclude -I"$GITHUB_WORKSPACE/sdk-root/include" \
              ci/fingerprint.c src/*.c "$GITHUB_WORKSPACE/sdk-root/lib/libaxilog.a" -o "$RUNNER_TEMP/fingerprint"
          got=$("$RUNNER_TEMP/fingerprint" | sha256sum | cut -d' ' -f1)
          want=$(cut -d' ' -f1 ci/fingerprints.txt)
          echo "FINGERPRINT axioma-governance ${{ matrix.name }} $(uname -m) $got"
          test "$got" = "$want"
      - name: AX:PROOF:v1 valid-record fingerprint (PCR-007; must equal pristine main)
        run: |
          cd estate/axioma-governance
          SAN="${{ matrix.san }}"
          ${{ matrix.cc }} -std=c99 -O2 $SAN -Iinclude -I"$GITHUB_WORKSPACE/sdk-root/include" \
              ci/fingerprint_proof.c src/*.c "$GITHUB_WORKSPACE/sdk-root/lib/libaxilog.a" -o "$RUNNER_TEMP/fingerprint_proof"
          got=$("$RUNNER_TEMP/fingerprint_proof" | sha256sum | cut -d' ' -f1)
          want=$(cut -d' ' -f1 ci/fingerprints-proof.txt)
          echo "FINGERPRINT axioma-governance-proof ${{ matrix.name }} $(uname -m) $got"
          test "$got" = "$want"
  known-defect-pinned-main:
    # D-03 must still reproduce on the pinned main commit until Part A merges.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: estate/axioma-governance
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: estate/gov-main
          ref: ${{ env.MAIN_SHA }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SpeyTech/axioma-spec
          ref: ${{ env.SPEC_MAIN_SHA }}
          path: estate/axioma-spec
      - name: Build substrate
        run: |
          cmake -S estate/axioma-spec -B build-spec -DCMAKE_BUILD_TYPE=Release && cmake --build build-spec
      - name: Assert D-03 reproduces on pinned main (sanitized test must FAIL there)
        run: |
          gcc -std=c99 -g -fsanitize=address,undefined -fno-sanitize-recover=all -DAX_MERKLE_MAX_DEPTH=20 \
              -Iestate/gov-main/include -Iestate/axioma-spec/include \
              estate/axioma-governance/tests/test_merkle_bounds.c estate/gov-main/src/*.c \
              build-spec/libaxilog.a -o d03_main
          if ./d03_main; then echo "D-03 no longer reproduces on $MAIN_SHA: update this job"; exit 1; fi
          echo "D-03 reproduces on $MAIN_SHA (expected until PCR-002 Part A merges)"
      - name: Assert D-11 reproduces on pinned main (PCR-007 test must FAIL there)
        run: |
          gcc -std=c99 -g -fsanitize=address,undefined -fno-sanitize-recover=all -DAX_PROOF_MAX_EVIDENCE_REFS=192 \
              -Iestate/gov-main/include -Iestate/axioma-spec/include \
              estate/axioma-governance/tests/test_proof_capacity.c estate/gov-main/src/*.c \
              build-spec/libaxilog.a -o d11_main
          if ./d11_main; then echo "D-11 no longer reproduces on $MAIN_SHA: update this job"; exit 1; fi
          echo "D-11 reproduces on $MAIN_SHA (expected until PCR-007 merges)"
      - name: Valid AX:PROOF:v1 records on pinned main equal the committed fingerprint
        run: |
          gcc -std=c99 -O2 -Iestate/gov-main/include -Iestate/axioma-spec/include \
              estate/axioma-governance/ci/fingerprint_proof.c estate/gov-main/src/*.c build-spec/libaxilog.a -o fpp_main
          got=$(./fpp_main | sha256sum | cut -d' ' -f1)
          want=$(cut -d' ' -f1 estate/axioma-governance/ci/fingerprints-proof.txt)
          echo "FINGERPRINT axioma-governance-proof pinned-main $(uname -m) $got"
          test "$got" = "$want"
